# Model-in-the-loop evals: per-node scores with regression thresholds, nightly and on prompt or
# model changes. They need a running Argus stack, so they run against EVAL_API_URL (the deployed
# watch floor's /api) with credentials that may assume the deployment's argus-operator role: the
# API admits that role's caller token, the LLM judge runs with the same session, and the scores
# are pushed to CloudWatch. Credentials come from GitHub's OIDC provider (the stack creates the
# role with `-c githubRepo=owner/name`), so no long-lived access key lives in repository secrets.
# Without the secret the job records a notice and exits green: it must never block CI for
# contributors without a stack.
name: evals
on:
  schedule: [{cron: "17 2 * * *"}]
  workflow_dispatch:
  pull_request:
    paths: ["agents/shared/prompts/**", "agents/shared/models.py", "agents/shared/config.py", "agents/**/app.py", "evals/**"]
jobs:
  node-evals:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # request the OIDC token that stands in for an access key
      contents: read
    env:
      # A step `if` cannot read the secrets context, so the URL is mapped to env once here.
      EVAL_API_URL: ${{ secrets.EVAL_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r evals/requirements.txt pyyaml==6.0.3 pydantic==2.13.5
      - name: assume the operator role
        if: ${{ env.EVAL_API_URL != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # The CI role is assumed from the OIDC token, then it assumes the operator role.
          role-to-assume: ${{ secrets.EVAL_CI_ROLE_ARN }}
          role-chaining: false
          role-duration-seconds: 3600
          aws-region: us-east-1
      - name: chain to the operator role
        if: ${{ env.EVAL_API_URL != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.EVAL_OPERATOR_ROLE_ARN }}
          role-chaining: true
          role-duration-seconds: 3600
          aws-region: us-east-1
      - name: node evals
        env:
          EVAL_AUTH: aws-iam
          EVAL_TLS_VERIFY: ${{ vars.EVAL_TLS_VERIFY || 'true' }}
          AWS_REGION: us-east-1
        run: |
          if [ -z "$EVAL_API_URL" ]; then echo "::notice::EVAL_API_URL not set; node evals skipped"; exit 0; fi
          python evals/node_evals.py --api "$EVAL_API_URL" --gate --push
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: eval-results, path: evals/results/, if-no-files-found: ignore}
