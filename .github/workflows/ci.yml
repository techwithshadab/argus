name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v7
        with: {node-version: "22"}
      - run: pip install ruff==0.16.5 pytest==9.1.1 pyyaml==6.0.3 pydantic==2.13.5
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q -m "not integration"
      - name: cdk synth
        # A real gate, not `|| true`. The environment lookups (availability zones, the S3
        # prefix list) are the only thing that needed credentials, so they are committed
        # as a fixture for the CI account; an infrastructure regression now fails here
        # instead of landing silently and failing at deploy time.
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: |
          pip install -r infra/cdk/requirements.txt
          npm install -g aws-cdk@2
          cp infra/cdk/cdk.context.ci.json infra/cdk/cdk.context.json
          cd infra/cdk && cdk synth --all -q
      - name: template assertions
        run: pytest -q tests/test_templates.py
      - name: compose config
        run: docker compose config -q

      # Dependencies are `==` pinned across seven requirements files, so a known
      # vulnerability stays until someone looks. This looks on every push.
      - name: pip-audit
        run: |
          pip install pip-audit==2.9.0
          for f in $(git ls-files '*requirements*.txt'); do
            echo "::group::$f"
            pip-audit -r "$f" --strict || echo "::warning::pip-audit findings in $f"
            echo "::endgroup::"
          done

  # Container images: build one and scan it. The images go to the CDK bootstrap ECR
  # repository, which this project does not own, so scan-on-push cannot be set from the
  # stack; scanning the built image here catches the same thing before it is pushed.
  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build the API image
        run: docker build -f services/api/Dockerfile -t argus-api:ci .
      - name: scan for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: argus-api:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"   # report first; make it blocking once the baseline is clean

  # Deterministic detector evals against a real PostGIS (phase 5). No model involved.
  detectors:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env: {POSTGRES_USER: argus, POSTGRES_PASSWORD: argus, POSTGRES_DB: argus}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U argus -d argus" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install pytest==9.1.1 pyyaml==6.0.3 pydantic==2.13.5 -r mcp-servers/requirements.txt
      - run: pytest -q -m integration tests/integration
        env:
          DATABASE_URL: postgresql://argus:argus@localhost:5432/argus
          DATA_KEY: ci-data-key
