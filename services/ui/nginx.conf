server {
  listen 8080;
  root /usr/share/nginx/html;
  location / { try_files $uri /index.html; }
  location /api/ {
    # Static proxy_pass on purpose: `api` is a Service Connect name, resolved at start
    # by the container's own resolver. Pointing a runtime `resolver` at the VPC DNS
    # (169.254.169.253) instead produced "api could not be resolved (Host not found)"
    # and 502s, because VPC DNS does not know Service Connect names.
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Everything through this block came from the public balancer, whatever Host
    # nginx forwards. officerauth.py refuses /metrics and /health on it (P14);
    # the collector scrapes the API directly and never sets it.
    proxy_set_header X-Argus-Public "1";
    proxy_buffering off;          # required for SSE
    proxy_read_timeout 3600;
  }
}
