global: {scrape_interval: 10s, evaluation_interval: 30s}
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: otel-collector
    static_configs: [{targets: ["otel-collector:8889", "otel-collector:8888"]}]
  - job_name: tempo
    static_configs: [{targets: ["tempo:3200"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  # Service-level indicators computed by the API from the jobs, investigations and eval tables (phase 5).
  - job_name: argus-api
    scrape_interval: 60s
    static_configs: [{targets: ["api:8000"]}]
