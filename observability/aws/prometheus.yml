# Prometheus on AWS: application metrics arrive by remote write from the ADOT collector
# (which scrapes the API's /metrics through the internal ALB); only in-task targets are scraped,
# so this task depends on nothing that might start after it.
global: {scrape_interval: 15s, evaluation_interval: 30s}
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: tempo
    static_configs: [{targets: ["localhost:3200"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
